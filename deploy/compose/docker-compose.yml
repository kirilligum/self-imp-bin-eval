services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${BIN_EVAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BIN_EVAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BIN_EVAL_POSTGRES_DB}
    ports:
      - "127.0.0.1:${BIN_EVAL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BIN_EVAL_POSTGRES_USER} -d ${BIN_EVAL_POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${BIN_EVAL_POSTGRES_USER}
      POSTGRES_PWD: ${BIN_EVAL_POSTGRES_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # The shared agent network reaches this existing Temporal container
      # through a second interface.  Bind the server on all container
      # interfaces while retaining the primary address as its broadcast
      # address, so both Compose projects use the same Temporal daemon.
      BIND_ON_IP: 0.0.0.0
    ports:
      - "127.0.0.1:${BIN_EVAL_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  public-gateway:
    profiles: ["public"]
    image: nginx:1.28.2-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: ^BIN_EVAL_PUBLIC_(BEARER_TOKEN|GATEWAY_PORT|BACKEND_URL)$$
      BIN_EVAL_PUBLIC_BEARER_TOKEN: ${BIN_EVAL_PUBLIC_BEARER_TOKEN:-}
      BIN_EVAL_PUBLIC_GATEWAY_PORT: ${BIN_EVAL_PUBLIC_GATEWAY_PORT:-18081}
      BIN_EVAL_PUBLIC_BACKEND_URL: ${BIN_EVAL_PUBLIC_BACKEND_URL:-http://127.0.0.1:8080}
    volumes:
      - ./nginx-public.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${BIN_EVAL_PUBLIC_GATEWAY_PORT}/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 2s

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared@sha256:59bab8d3aceec09bf6bdb07d6beca0225ca5cd7ab79436a87ea97978fe1dc4f9
    user: "${BIN_EVAL_CLOUDFLARED_UID:-65532}:${BIN_EVAL_CLOUDFLARED_GID:-65532}"
    network_mode: host
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - ${BIN_EVAL_CLOUDFLARED_LOG_LEVEL:-info}
      - run
      - --token-file
      - /run/secrets/tunnel-token
    depends_on:
      public-gateway:
        condition: service_healthy
    volumes:
      - ../local/bin-eval-cloudflared-token:/run/secrets/tunnel-token:ro
    labels:
      co.prls.service: bin-eval-public-tunnel

volumes:
  postgres-data:
